<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reestar</title>
  <!-- Link the external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Reestar</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#recipes">Recipes</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Recipes Section -->
  <section id="recipes" class="recipes">
    <div class="recipe-card">
      <img src="https://www.themealdb.com/images/media/meals/1548772327.jpg" alt="Recipe 1">
      <div class="recipe-info">
        <h3>Tangy Tamarind Prawn Curry</h3>
        <p>Something which is very delicious</p>
        <button class="order-btn">Order Now</button>
      </div>
    </div>

    <div class="recipe-card">
      <img src="https://www.themealdb.com/images/media/meals/1529446352.jpg" alt="Recipe 2">
      <div class="recipe-info">
        <h3>Cheesy Pasta</h3>
        <p>Something which is very delicious</p>
        <button class="order-btn">Order Now</button>
      </div>
    </div>

    <div class="recipe-card">
      <img src="https://www.themealdb.com/images/media/meals/wxywrq1468235067.jpg" alt="Recipe 3">
      <div class="recipe-info">
        <h3>Egg Rice Bowl</h3>
        <p>Something which is very delicious</p>
        <button class="order-btn">Order Now</button>
      </div>
    </div>

    <div class="recipe-card">
      <img src="https://www.themealdb.com/images/media/meals/1549542994.jpg" alt="Recipe 4">
      <div class="recipe-info">
        <h3>Pancake Stack</h3>
        <p>Something which is very delicious</p>
        <button class="order-btn">Order Now</button>
      </div>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="contact-section">
    <div class="contact">
      <h2>Contact Us</h2>
      <form>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Enter your age" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <button type="submit">Send</button>
      </form>
    </div>
  </section>
</body>
</html>
